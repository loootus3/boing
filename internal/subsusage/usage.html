<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage</title>
<!--
  Visual style, chart, email redaction and provider marks adapted from T3 Code
  (https://github.com/pingdotgg/t3code), MIT License, Copyright (c) 2026 T3 Tools Inc.
  Claude and OpenAI marks are trademarks of their respective owners.
-->
<style>
:root{
  --background:oklch(99.2% 0 0);--foreground:#18181b;--card:#fff;--popover:#fff;
  --muted:#f4f4f5;--muted-foreground:#71717a;--accent:#f4f4f5;--border:#e4e4e7;--input:#d4d4d8;
  --success:#10b981;--success-foreground:#047857;--warning:#f59e0b;--warning-foreground:#b45309;
  --error:#ef4444;--error-foreground:#b91c1c;--info:#3b82f6;--info-foreground:#1d4ed8;
  --claude:#d97757;--codex:var(--foreground);--radius:.5rem;color-scheme:light;
  --font-mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --background:#000;--foreground:#f5f5f5;--card:#0b0b0b;--popover:#0b0b0b;
  --muted:rgba(255,255,255,.07);--muted-foreground:#a3a3a3;--accent:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.08);--input:rgba(255,255,255,.11);
  --success-foreground:#34d399;--warning-foreground:#fbbf24;--error:#f05252;--error-foreground:#f87171;--info-foreground:#60a5fa;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--background);color:var(--foreground)}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter Variable","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.logo{width:16px;height:16px;flex:none}
.logo.claude{fill:#d97757}.logo.codex{fill:currentColor}
.tabular{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;min-height:52px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px 8px 20px;
  border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--background) 80%,transparent);
  backdrop-filter:blur(12px) saturate(1.14);-webkit-backdrop-filter:blur(12px) saturate(1.14)}
.topbar h1{font-size:14px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.topbar .range{font-size:12px;font-weight:400;color:var(--muted-foreground);margin-left:6px}
.spacer{flex:1}
.seg{display:flex;width:fit-content;gap:2px;border-radius:8px;background:color-mix(in srgb,var(--input) 40%,transparent);padding:2px}
.seg button{height:24px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--muted-foreground);font:500 12px/1 inherit;cursor:pointer}
.seg button:hover{background:color-mix(in srgb,var(--background) 55%,transparent);color:var(--foreground)}
.seg button.on{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){.seg button.on{background:color-mix(in srgb,var(--input) 72%,transparent)}}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--input);border-radius:var(--radius);
  background:var(--popover);color:var(--foreground);font:500 14px/1 inherit;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:background .15s,transform .05s}
.btn:hover{background:var(--accent)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.64;cursor:default}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.ghost{border-color:transparent;background:none;box-shadow:none}
.btn.ghost:hover{background:var(--accent)}
.btn.sm{height:24px;padding:0 8px;font-size:12px;border-radius:6px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:16rem;padding:4px;border:1px solid var(--border);border-radius:10px;
  background:var(--popover);box-shadow:0 8px 24px rgba(0,0,0,.14);display:none}
.menu.open{display:block}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:8px 10px;border:0;border-radius:6px;
  background:none;color:var(--foreground);font:500 13px/1.3 inherit;text-align:left;cursor:pointer}
.menu button:hover{background:var(--accent)}
.menu button small{font-size:12px;font-weight:400;color:var(--muted-foreground)}

main{max-width:62rem;margin:0 auto;padding:24px 20px 72px;display:flex;flex-direction:column;gap:32px}
h2.t{font-size:14px;font-weight:500;margin:0}
.toast{font-size:12px;color:var(--muted-foreground);min-height:18px;margin:-12px 0 -20px}
.toast.err{color:var(--error-foreground)}
.paste{display:none;flex-direction:column;gap:8px;border:1px solid color-mix(in srgb,var(--border) 60%,transparent);border-radius:12px;padding:14px 16px}
.paste.open{display:flex}
.paste p{margin:0;font-size:12px;color:var(--muted-foreground)}
.paste .row{display:flex;gap:8px}
.paste input{flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid var(--input);border-radius:var(--radius);background:var(--popover);
  color:var(--foreground);font:13px/1 var(--font-mono)}

/* overview */
.overview{display:grid;gap:24px;grid-template-columns:minmax(0,18rem) minmax(0,1fr)}
@media (max-width:860px){.overview{grid-template-columns:1fr}}
.big{font-size:36px;line-height:1.1;font-weight:600;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted-foreground);margin-top:4px}
.prov-rows{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.prow .l1{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.prow .name{display:flex;align-items:center;gap:8px;font-size:14px}
.prow .dot{width:8px;height:8px;border-radius:50%}
.prow .name small{font-size:11px;color:var(--muted-foreground)}
.prow .val{font-size:14px;font-weight:500}
.prow .l2{font-size:12px;color:var(--muted-foreground);margin-top:2px}
.chart-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.chart{display:flex;gap:8px}
.ylabels{position:relative;width:48px;height:224px;flex:none}
.ylabels span{position:absolute;right:0;transform:translateY(-50%);font-size:10px;color:var(--muted-foreground)}
.plot{position:relative;flex:1;height:224px;min-width:0}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plot .grid{stroke:var(--border);stroke-width:1}
.plot .hover{position:absolute;top:8px;bottom:0;width:1px;background:var(--muted-foreground);opacity:0;pointer-events:none}
.xlabels{display:flex;justify-content:space-between;padding-left:56px;font-size:10px;color:var(--muted-foreground);text-transform:uppercase}
.tip{position:absolute;z-index:10;min-width:9rem;border:1px solid color-mix(in srgb,var(--border) 50%,transparent);border-radius:12px;padding:8px 10px;
  font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);pointer-events:none;display:none;
  background:color-mix(in srgb,var(--background) 80%,transparent);backdrop-filter:blur(12px) saturate(1.14);-webkit-backdrop-filter:blur(12px) saturate(1.14)}
.tip .d{color:var(--muted-foreground);margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px;align-items:center}
.tip .r span{display:flex;align-items:center;gap:6px;color:var(--muted-foreground)}
.tip .r b{font-weight:500}
.tip .logo{width:12px;height:12px}
.tip .tot{margin-top:4px;border-top:1px solid var(--border);padding-top:4px}
.empty-chart{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--muted-foreground)}

/* totals */
.totals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px 24px;padding:4px 0}
@media (max-width:760px){.totals{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat .k{font-size:12px;color:var(--muted-foreground)}
.stat .v{font-size:16px;font-weight:500}
.ubar{display:flex;gap:3px;height:8px}
.ubar>i{flex:1;position:relative;display:block;height:8px;border-radius:999px;background:var(--muted)}
.ubar>i>b{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.ubar>i:first-child:hover::after{left:0;right:auto}
.ufoot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid color-mix(in srgb,var(--border) 60%,transparent);padding-top:10px;font-size:12px}
.ufoot small,.umuted{color:var(--muted-foreground)}
.ulist{display:flex;flex-direction:column;gap:6px;font-size:12px}
.urow{display:flex;align-items:center;gap:8px;min-width:0;padding:3px 6px;margin:0 -6px;border-radius:8px}
.urow.active{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--info) 55%,transparent);background:color-mix(in srgb,var(--info) 6%,transparent)}
.ubar>i.active{outline:1.5px solid var(--info);outline-offset:1px}
.urow .dot{width:8px;height:8px;border-radius:50%;flex:none}
.uwho{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
.uwho .avatar{flex:none}
.uwho .redact{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unum{display:flex;gap:10px;flex:none;white-space:nowrap}
@media (max-width:640px){.urow{flex-wrap:wrap}.uwho{flex:1 1 100%}.unum{margin-left:16px}}

/* limits */
.limits{display:flex;flex-direction:column;gap:28px}
section.prov{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:center;gap:8px;padding:0 4px}
.sec-head h2{font-size:16px;font-weight:600;margin:0;flex:1;display:flex;align-items:center;gap:8px}
.sec-head h2 .logo{width:20px;height:20px}
.sec-head .count{font-size:12px;color:var(--muted-foreground)}
.group{border:1px solid color-mix(in srgb,var(--border) 60%,transparent);border-radius:12px;
  background:color-mix(in srgb,var(--card) 40%,transparent);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.group>.acct+.acct{border-top:1px solid color-mix(in srgb,var(--border) 50%,transparent)}
.acct{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.group>.acct.active,.group>.acct.active+.acct{border-top-color:transparent}
.acct.active{position:relative;border-radius:11px;box-shadow:inset 0 0 0 1.5px var(--info);background:color-mix(in srgb,var(--info) 6%,transparent)}
.acct.off{opacity:.62}
.acct-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.who{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.avatar{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:600;flex:none}
.redact{min-width:0;border:0;padding:0;background:none;cursor:pointer;border-radius:4px;font:12px/1.5 var(--font-mono);color:var(--muted-foreground);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:filter .15s,color .15s;text-align:left}
.redact:hover{color:var(--foreground)}
.redact.hidden{filter:blur(4px);user-select:none}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;font-size:12px;font-weight:500;
  border:1px solid transparent;white-space:nowrap}
.badge.outline{border-color:var(--input);color:var(--muted-foreground)}
.badge.err{background:color-mix(in srgb,var(--error) 10%,transparent);color:var(--error-foreground)}
.sel{height:24px;padding:0 22px 0 8px;border:1px solid var(--input);border-radius:6px;background-color:var(--popover);color:var(--muted-foreground);
  font:500 12px/1 inherit;cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 11px) 10px,calc(100% - 7px) 10px;background-size:4px 4px;background-repeat:no-repeat}
.sel:hover{color:var(--foreground)}
.spark{width:96px;height:24px;flex:none}
.limit{display:grid;grid-template-columns:11rem minmax(0,1fr) 8rem;column-gap:16px;align-items:center;font-size:12px}
.limit .lbl{display:flex;align-items:center;gap:8px;color:var(--muted-foreground);min-width:0}
.limit .lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.limit .lbl b{margin-left:auto;color:var(--foreground);font-weight:500;white-space:nowrap}
.limit.low .lbl b{color:var(--warning-foreground)}
.limit.crit .lbl b{color:var(--error-foreground)}
.bar{position:relative;height:24px}
.bar::before{content:"";position:absolute;inset:6px 0;border-radius:999px;background:var(--muted)}
.bar i{position:absolute;top:6px;bottom:6px;left:0;border-radius:999px;background:var(--c);transition:width .4s}
.bar u{position:absolute;top:4px;bottom:4px;width:2px;transform:translateX(-50%);border-radius:999px;background:var(--foreground);
  box-shadow:0 0 0 2px var(--background)}
.limit .reset{display:flex;align-items:center;justify-content:flex-end;gap:6px;color:var(--muted-foreground);white-space:nowrap;cursor:default}
.limit .reset svg{width:14px;height:14px}
.limit.sub{opacity:.82}
.note{font-size:12px;color:var(--muted-foreground)}
.note.err{color:var(--error-foreground)}
.empty{padding:20px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.empty p{margin:0;font-size:12px;color:var(--muted-foreground)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;right:0;bottom:calc(100% + 6px);z-index:10;width:max-content;max-width:18rem;
  white-space:pre-line;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--popover);
  color:var(--foreground);font-size:12px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.14)}
/* projections */
.proj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.proj{grid-template-columns:1fr}}
.pcard{border:1px solid color-mix(in srgb,var(--border) 60%,transparent);border-radius:12px;padding:16px;
  background:color-mix(in srgb,var(--card) 40%,transparent);display:flex;flex-direction:column;gap:14px}
.pcard h3{margin:0;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.pcard h3 .pill{margin-left:auto}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pstat .k{font-size:11px;color:var(--muted-foreground)}
.pstat .v{font-size:22px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.pstat .v small{font-size:12px;font-weight:400;color:var(--muted-foreground);margin-left:2px}
.pstat .s{font-size:11px;color:var(--muted-foreground)}
.pnote{font-size:12px;color:var(--muted-foreground);line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500}
.pill.ok{background:color-mix(in srgb,var(--success) 12%,transparent);color:var(--success-foreground)}
.pill.warn{background:color-mix(in srgb,var(--warning) 14%,transparent);color:var(--warning-foreground)}
.pill.bad{background:color-mix(in srgb,var(--error) 12%,transparent);color:var(--error-foreground)}
.pill.idle{background:var(--muted);color:var(--muted-foreground)}
.timeline{position:relative;height:28px;border-radius:8px;background:var(--muted);overflow:hidden}
.timeline i{position:absolute;top:0;bottom:0;border-radius:0}
.timeline b{position:absolute;top:3px;bottom:3px;width:2px;border-radius:2px;background:var(--foreground);opacity:.55}
.tl-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted-foreground);text-transform:uppercase;margin-top:-8px}
.forecast{font-size:12px;color:var(--muted-foreground);padding-left:calc(11rem + 16px);margin:-2px 0 2px}
.forecast.bad{color:var(--error-foreground)}.forecast.ok{color:var(--success-foreground)}
@media (max-width:640px){.forecast{padding-left:0}.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .topbar{padding-left:12px}
  .limit{grid-template-columns:minmax(0,7.5rem) minmax(3rem,1fr) auto;column-gap:10px}
  .spark{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <h1><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Usage<span class="range tabular" id="rangeLabel"></span></h1>
  <div class="spacer"></div>
  <div class="seg" id="period">
    <button data-v="24h">24h</button><button data-v="7d">7 dias</button><button data-v="30d">30 dias</button>
  </div>
  <div class="seg" id="metric">
    <button data-v="tokens">Tokens</button><button data-v="requests">Requisições</button>
  </div>
  <div class="menu-wrap"><button class="btn" data-menu="claude"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Claude</button></div>
  <div class="menu-wrap"><button class="btn" data-menu="codex"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Codex</button></div>
</header>
<main>
  <div class="toast" id="toast"></div>
  <div class="paste" id="paste">
    <p><b>Conectando de outro computador?</b> Depois de autorizar, a aba vai para um endereço <code>localhost</code> que não abre.
       Copie a URL inteira dessa aba e cole aqui.</p>
    <div class="row"><input id="pasteUrl" placeholder="http://localhost:54545/callback?code=…" autocomplete="off" spellcheck="false">
      <button class="btn" id="pasteBtn">Concluir</button></div>
  </div>

  <section class="overview">
    <div>
      <div class="big tabular" id="bigValue">—</div>
      <div class="sub" id="bigSub"></div>
      <div class="prov-rows" id="provRows"></div>
    </div>
    <div class="chart-col">
      <h2 class="t" id="chartTitle"></h2>
      <div class="chart">
        <div class="ylabels tabular" id="ylabels"></div>
        <div class="plot" id="plot"><svg id="chartSvg" viewBox="0 0 960 260" preserveAspectRatio="none"></svg><div class="hover" id="hoverLine"></div><div class="tip" id="tip"></div></div>
      </div>
      <div class="xlabels tabular" id="xlabels"></div>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px">
    <h2 class="t">Totais</h2>
    <div class="totals" id="totals"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px">
    <h2 class="t">Projeção</h2>
    <div class="proj" id="proj"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px">
    <h2 class="t">Uso</h2>
    <div class="proj" id="usage"></div>
  </section>

  <div class="limits" id="list"></div>
</main>
<script>
const LOGO={

const PROVIDERS=[{key:"claude",name:"Claude",color:"#d97757"},{key:"codex",name:"Codex",color:"var(--codex)"}];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};
const state={period:store.get("usage.period","7d"),metric:store.get("usage.metric","tokens"),data:{accounts:[]},hist:null};

/* formatting (after T3 Code usageFormat) */
function fmtTokens(v){const a=Math.abs(v);for(const[u,d]of[["T",1e12],["B",1e9],["M",1e6],["K",1e3]]){if(a>=d){const x=v/d;
  return String(Number(x.toFixed(Math.abs(x)>=100?0:Math.abs(x)>=10?1:2))).replace(".",",")+u}}return String(Math.round(v))}
const fmtCount=v=>Math.round(v).toLocaleString("pt-BR");
const fmtMetric=v=>state.metric==="tokens"?fmtTokens(v):fmtCount(v);
const fmtPct=s=>s>0&&s<.001?"<0,1%":(s*100).toFixed(1).replace(".",",")+"%";
const fmtDay=d=>d.toLocaleDateString("pt-BR",{day:"numeric",month:"short"}).replace(".","");
const fmtHour=d=>d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const fmtDate=d=>d.toLocaleString("pt-BR",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
function fmtLeft(ms){if(ms<=0)return"agora";const m=Math.max(1,Math.round(ms/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
  return d?`${d}d ${h}h`:h?`${h}h ${mm}m`:`${mm}m`}
function toast(msg,err){const t=$("#toast");t.textContent=msg||"";t.className="toast"+(err?" err":"")}

/* email redaction (after T3 Code RedactedSensitiveText) */
const RED_ALPHA="abcdefghjkmnpqrstuvwxyz23456789";
function redacted(v){let s=0x811c9dc5;for(let i=0;i<v.length;i++){s^=v.charCodeAt(i);s=Math.imul(s,0x01000193)}
  const next=()=>{s=Math.imul(s^(s>>>13),0x85ebca6b);s=Math.imul(s^(s>>>16),0xc2b2ae35);return RED_ALPHA[Math.abs(s)%RED_ALPHA.length]||"x"};
  return Array.from(v,c=>"@.-_".includes(c)?c:next()).join("")}
const revealed=new Set();
function hue(v){let h=0;for(const c of v)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%360}
function initials(v){const[l,d]=String(v).split("@");return(((l||"")[0]||"")+((d||"")[0]||"")).toUpperCase()||"?"}
function who(email){const h=hue(email),open=revealed.has(email);
  return `<span class="avatar" style="background:oklch(.85 .08 ${h});color:oklch(.35 .1 ${h})">${esc(initials(email))}</span>
    <button class="redact${open?"":" hidden"}" data-reveal="${esc(email)}" title="${open?"Clique para esconder o e-mail":"Clique para mostrar o e-mail"}">${esc(open?email:redacted(email))}</button>`}
const legendName=email=>revealed.has(email)?email:redacted(email);

/* chart helpers (after T3 Code UsageProviderChart) */
function niceScale(peak,n){if(!(peak>0))return{max:1,ticks:[0,1]};const raw=peak/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),norm=raw/mag;
  const step=(norm>5?10:norm>2?5:norm>1?2:1)*mag,max=Math.ceil(peak/step)*step,ticks=[];for(let v=0;v<=max+step/2;v+=step)ticks.push(v);return{max,ticks}}
function smooth(pts){const n=pts.length;if(!n)return"";if(n===1)return`M${pts[0][0]},${pts[0][1]}`;
  const m=[],t=[];for(let i=0;i<n-1;i++)m.push((pts[i+1][1]-pts[i][1])/(pts[i+1][0]-pts[i][0]));
  t[0]=m[0];for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;t[n-1]=m[n-2];
  for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=0;t[i+1]=0;continue}const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;if(s>9){const k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}
  let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<n-1;i++){const dx=(pts[i+1][0]-pts[i][0])/3;
    d+=` C${pts[i][0]+dx},${pts[i][1]+t[i]*dx} ${pts[i+1][0]-dx},${pts[i+1][1]-t[i+1]*dx} ${pts[i+1][0]},${pts[i+1][1]}`}return d}
const sumVals=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);

function renderOverview(){
  const h=state.hist;if(!h||!h.buckets||!h.buckets.length)return;
  const key=state.metric==="tokens"?"tokens":"requests",hourly=h.step<86400;
  const series=PROVIDERS.map(p=>{const vals=h.buckets.map(b=>(b[key]||{})[p.key]||0);return{...p,vals,total:vals.reduce((a,b)=>a+b,0)}});
  const grand=series.reduce((a,s)=>a+s.total,0);
  const reqTotal=h.buckets.reduce((a,b)=>a+sumVals(b.requests),0),tokTotal=h.buckets.reduce((a,b)=>a+sumVals(b.tokens),0);
  const first=new Date(h.buckets[0].t*1000),last=new Date(h.buckets[h.buckets.length-1].t*1000);
  $("#rangeLabel").textContent=hourly?`${fmtHour(first)} até agora`:`${fmtDay(first)} até ${fmtDay(last)}`;
  $("#bigValue").textContent=fmtMetric(grand);
  $("#bigSub").textContent=state.metric==="tokens"?`${fmtCount(reqTotal)} requisições pelo proxy`:`${fmtTokens(tokTotal)} tokens processados`;
  $("#provRows").innerHTML=series.map(s=>{
    const reqs=h.buckets.reduce((a,b)=>a+((b.requests||{})[s.key]||0),0),toks=h.buckets.reduce((a,b)=>a+((b.tokens||{})[s.key]||0),0);
    const share=grand?s.total/grand:0;
    return `<div class="prow"><div class="l1"><span class="name"><span class="dot" style="background:${s.color}"></span>${LOGO[s.key]}${s.name}
      <small>${fmtCount(reqs)} req</small></span><span class="val tabular">${fmtMetric(s.total)}</span></div>
      <div class="l2 tabular">${fmtPct(share)} ${state.metric==="tokens"?"dos tokens · "+fmtCount(reqs)+" requisições":"das requisições · "+fmtTokens(toks)+" tokens"}</div></div>`}).join("");
  $("#chartTitle").textContent=(state.metric==="tokens"?"Tokens processados":"Requisições")+(hourly?" por hora":" por dia");

  const n=h.buckets.length,peak=Math.max(0,...series.flatMap(s=>s.vals)),sc=niceScale(peak,4);
  const X=i=>n<2?480:i/(n-1)*960,Y=v=>260-(v/sc.max)*(260-8);
  let svg=sc.ticks.map(t=>`<line class="grid" x1="0" x2="960" y1="${Y(t)}" y2="${Y(t)}" vector-effect="non-scaling-stroke"/>`).join("");
  for(const s of [...series].sort((a,b)=>b.total-a.total)){
    if(!s.total)continue;const line=smooth(s.vals.map((v,i)=>[X(i),Y(v)]));
    svg+=`<path d="${line} L960,260 L0,260 Z" fill="${s.color}" fill-opacity=".12"/>
      <path d="${line}" fill="none" stroke="${s.color}" stroke-width="2" vector-effect="non-scaling-stroke"/>`}
  $("#chartSvg").innerHTML=svg;
  $("#plot").querySelector(".empty-chart")?.remove();
  if(!grand)$("#plot").insertAdjacentHTML("beforeend",`<div class="empty-chart">Nenhuma atividade nesse período.</div>`);
  $("#ylabels").innerHTML=sc.ticks.map(t=>`<span style="top:${Y(t)/260*100}%">${t?fmtMetric(t):"0"}</span>`).join("");
  const lab=i=>{const d=new Date(h.buckets[i].t*1000);return hourly?fmtHour(d):fmtDay(d)};
  $("#xlabels").innerHTML=`<span>${lab(0)}</span><span>${lab(Math.floor((n-1)/2))}</span><span>${lab(n-1)}</span>`;

  const plot=$("#plot"),tip=$("#tip"),hl=$("#hoverLine");
  plot.onmousemove=e=>{const r=plot.getBoundingClientRect(),x=e.clientX-r.left,i=Math.max(0,Math.min(n-1,Math.round(x/r.width*(n-1))));
    const d=new Date(h.buckets[i].t*1000);hl.style.left=(n<2?50:i/(n-1)*100)+"%";hl.style.opacity=.6;
    let tot=0,rows="";for(const s of series){const v=s.vals[i];tot+=v;rows+=`<div class="r"><span>${LOGO[s.key]}${s.name}</span><b class="tabular">${fmtMetric(v)}</b></div>`}
    tip.innerHTML=`<div class="d">${hourly?fmtDate(d):d.toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"})}</div>${rows}
      <div class="r tot"><span>Total</span><b class="tabular">${fmtMetric(tot)}</b></div>`;
    tip.style.display="block";const tw=tip.offsetWidth,th=tip.offsetHeight;
    let lx=x+12;if(lx+tw>r.width)lx=x-12-tw;const ly=Math.max(-8,Math.min(r.height-th+8,e.clientY-r.top-th/2));
    tip.style.left=lx+"px";tip.style.top=ly+"px"};
  plot.onmouseleave=()=>{tip.style.display="none";hl.style.opacity=0};

  let inp=0,out=0,cache=0,req=0,fail=0;for(const a of Object.values(h.accounts||{})){inp+=a.input;out+=a.output;cache+=a.cached;req+=a.requests;fail+=a.failed}
  $("#totals").innerHTML=[["Tokens processados",fmtTokens(inp+out)],["Input",fmtTokens(inp)],["Input em cache",fmtTokens(cache)],
    ["Output",fmtTokens(out)],["Requisições",fmtCount(req)+(fail?` · ${fmtCount(fail)} falhas`:"")]]
    .map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v tabular">${v}</div></div>`).join("");
}

/* projections from quota samples */
const DAY=86400;
function weeklyOf(a){return(a.windows||[]).find(w=>w.kind==="weekly"||w.kind==="monthly")}
function shortOf(a){return(a.windows||[]).find(w=>w.kind==="short")}

const clampPct=v=>Math.max(0,Math.min(100,Number(v)||0));
function leftColor(a,left){return left<=15||a.limit_reached?"var(--error)":left<=30?"var(--warning)":"var(--success)"}
function renderUsage(){
  const accounts=state.data.accounts||[],h=state.hist,now=Date.now();
  const val=id=>{const x=h&&h.accounts&&h.accounts[id];return x?(state.metric==="tokens"?(x.input||0)+(x.output||0):(x.requests||0)):0};
  $("#usage").innerHTML=PROVIDERS.map(p=>{
    const accs=accounts.filter(a=>a.provider===p.key),n=accs.length;
    const head=`<h3>${LOGO[p.key]||""}${esc(p.name)}<span class="umuted" style="margin-left:auto;font-weight:400;font-size:12px">${n} ${n===1?"conta":"contas"}</span></h3>`;
    if(!n)return `<div class="pcard">${head}<div class="pnote">Nenhuma conta conectada.</div></div>`;
    const ws=accs.map(weeklyOf),leftOf=(a,w)=>w&&!a.needs_login?100-clampPct(w.used_percent):0;
    const sum=accs.reduce((t,a,i)=>t+leftOf(a,ws[i]),0);
    const longs=ws.filter(Boolean),monthly=longs.length>0&&longs.every(w=>w.kind==="monthly");
    let soon=0;for(const w of longs){const t=Date.parse(w.reset_at);if(t>now&&(!soon||t<soon))soon=t}
    const segs=accs.map((a,i)=>{
      const w=ws[i],rem=leftOf(a,w),reset=w&&Date.parse(w.reset_at)?fmtLeft(Date.parse(w.reset_at)-now):"—";
      const op=a.needs_login?.4:a.mode==="off"?.5:1,fill=a.needs_login?"":`<b style="width:${rem}%;background:${leftColor(a,rem)}"></b>`;
      const tip=`${legendName(a.email||a.auth_id)}\n`+(a.needs_login?"precisa de login":`${Math.round(rem)}% restante · reseta em ${reset}`);
      return `<i${a.active?` class="active"`:""} data-tip="${esc(tip)}" style="opacity:${op}">${fill}</i>`}).join("");
    const shorts=accs.map(shortOf).filter(Boolean),M=shorts.length;
    const foot=M?`<div class="ufoot"><span class="umuted">Janela 5h</span><span class="tabular"><b style="font-weight:600">${Math.round(shorts.reduce((t,w)=>t+100-clampPct(w.used_percent),0))}%</b> <small>restante de ${M*100}%</small></span></div>`:"";
    const ptotal=accs.reduce((t,a)=>t+val(a.auth_id),0)||(h&&h.accounts?Object.keys(h.accounts).reduce((t,id)=>t+((h.providers||{})[id]===p.key?val(id):0),0):0);
    const rows=accs.map((a,i)=>{
      const w=ws[i],rem=leftOf(a,w),v=val(a.auth_id),email=a.email||a.auth_id;
      const dot=a.needs_login?"var(--muted)":leftColor(a,rem);
      return `<div class="urow${a.active?" active":""}"${a.active?` title="Conta em uso agora"`:""}><span class="dot" style="background:${dot}"></span><span class="uwho">${who(email)}</span>
        <span class="unum tabular"><span>${w&&!a.needs_login?Math.round(rem)+"%":"—"}</span><span>${v>0?`${fmtMetric(v)} <span class="umuted">${fmtPct(ptotal?v/ptotal:0)}</span>`:"—"}</span></span></div>`}).join("");
    return `<div class="pcard">${head}
      <div><div class="umuted" style="font-size:11px">${monthly?"Mensal":"Semanal"}</div>
        <div class="pstat"><div class="v tabular">${Math.round(sum)}%<small>restante de ${n*100}%</small></div></div></div>
      <div class="ubar">${segs}</div>
      ${soon?`<div class="umuted" style="font-size:12px;margin-top:-6px">próximo reset em ${fmtLeft(soon-now)} · ${esc(fmtDate(new Date(soon)))}</div>`:""}
      ${foot}
      <div class="ulist"><div class="umuted" style="font-size:11px">Consumo no período</div>${rows}</div></div>`}).join("");
}
// Sum of remaining-% drops (resets ignored) and the time span they cover.
function burnStats(points,key,sinceT){
  const pts=points.filter(p=>p[key]!=null&&(!sinceT||p.t>=sinceT));
  let drop=0,active=0;
  for(let i=1;i<pts.length;i++){const d=pts[i-1][key]-pts[i][key];if(d>0){drop+=d;active+=pts[i].t-pts[i-1].t}}
  return{drop,span:pts.length>1?pts[pts.length-1].t-pts[0].t:0,active};
}
function quotaOf(id){return(((state.hist&&state.hist.quota)||{})[id])||[]}
// Per-account forecast for the weekly window, using its own last-24h pace.
function accountForecast(a,now){
  const w=weeklyOf(a);if(!w||!w.reset_at)return null;
  const st=burnStats(quotaOf(a.auth_id),"w",now/1000-DAY);
  if(st.span<2*3600)return{text:"coletando dados de ritmo…"};
  const rate=st.drop/st.span;// %/s wall clock
  const left=100-w.used_percent,toReset=(new Date(w.reset_at)-now)/1000;
  if(rate<=0)return{text:"sem gasto nas últimas 24h",cls:"ok"};
  const eta=left/rate;
  if(eta<toReset)return{cls:"bad",text:`nesse ritmo acaba em ${fmtLeft(eta*1000)} · ${fmtLeft((toReset-eta)*1000)} antes do reset`};
  return{cls:"ok",text:`nesse ritmo sobra ~${Math.round(left-rate*toReset)}% no reset`};
}
// Simulates the provider's account pool hour by hour: daily burn drawn from the account that
// resets first, accounts refill at reset. Returns hours until nothing is left (capped).
function simulate(accs,perHour,now){
  const pool=accs.map(a=>{const w=weeklyOf(a);return{left:Math.max(0,100-w.used_percent),reset:new Date(w.reset_at)/1000,period:w.duration_sec||7*DAY}});
  const cap=60*24;let t=now/1000;
  for(let h=0;h<cap;h++){
    t+=3600;let need=perHour;
    for(const p of pool)while(p.reset<=t){p.left=100;p.reset+=p.period}
    pool.sort((x,y)=>x.reset-y.reset);
    for(const p of pool){if(need<=0)break;const take=Math.min(p.left,need);p.left-=take;need-=take}
    if(need>1e-9)return h;
  }
  return Infinity;
}
function renderProjections(){
  const now=Date.now(),cards=[];
  for(const p of PROVIDERS){
    const accs=(state.data.accounts||[]).filter(a=>a.provider===p.key&&a.mode!=="off"&&!a.needs_login&&weeklyOf(a)&&weeklyOf(a).reset_at);
    if(!accs.length){cards.push(`<div class="pcard"><h3>${LOGO[p.key]}${p.name}<span class="pill idle">sem contas ativas</span></h3></div>`);continue}
    let drop=0,span=0,active=0;
    for(const a of accs){const st=burnStats(quotaOf(a.auth_id),"w");drop+=st.drop;span=Math.max(span,st.span);active+=st.active}
    const left=accs.reduce((x,a)=>x+Math.max(0,100-weeklyOf(a).used_percent),0);
    const capWeek=accs.length*100;
    const nextReset=Math.min(...accs.map(a=>new Date(weeklyOf(a).reset_at)));
    let head="",body="",note="";
    if(span<6*3600){
      head=`<span class="pill idle">coletando dados</span>`;
      body=`<div class="pgrid">
        <div class="pstat"><div class="k">Restante agora</div><div class="v tabular">${Math.round(left)}<small>%</small></div><div class="s">de ${capWeek}% semanais</div></div>
        <div class="pstat"><div class="k">Próximo reset</div><div class="v tabular">${fmtLeft(nextReset-now)}</div><div class="s">${fmtDate(new Date(nextReset))}</div></div>
        <div class="pstat"><div class="k">Histórico</div><div class="v tabular">${Math.round(span/3600)}<small>h</small></div><div class="s">precisa de 6h</div></div></div>`;
      note="As médias aparecem depois de algumas horas de uso pelo proxy.";
    }else{
      const perDay=drop/span*DAY,perHour=perDay/24;
      const hours=perDay>0?simulate(accs,perHour,now):Infinity;
      const empty=perDay>0?left/perHour*3600*1000:Infinity;
      const weekUse=perDay*7/capWeek;
      const sustainable=hours===Infinity;
      head=sustainable?`<span class="pill ok">ritmo sustentável</span>`:hours<48?`<span class="pill bad">acaba em ${fmtLeft(hours*3600e3)}</span>`:`<span class="pill warn">${Math.floor(hours/24)} dias de folga</span>`;
      const daysTxt=sustainable?"∞":String(Math.floor(hours/24));
      body=`<div class="pgrid">
        <div class="pstat"><div class="k">Gasto médio por dia</div><div class="v tabular">${Math.round(perDay)}<small>%</small></div><div class="s">${fmtPct(Math.min(9.99,weekUse))} da capacidade semanal</div></div>
        <div class="pstat"><div class="k">Acaba sem resets em</div><div class="v tabular">${empty===Infinity?"—":fmtLeft(empty)}</div><div class="s">${Math.round(left)}% restantes somados</div></div>
        <div class="pstat"><div class="k">Dias seguidos de trabalho</div><div class="v tabular">${daysTxt}${sustainable?"":`<small>dias</small>`}</div><div class="s">${sustainable?"os resets cobrem seu ritmo":"contando os resets"}</div></div></div>`;
      // timeline of the next 14 days: green while there is quota, red after it runs out
      const H=14*24,end=Math.min(H,hours);
      body+=`<div class="timeline"><i style="left:0;width:${end/H*100}%;background:color-mix(in srgb,var(--success) 30%,transparent)"></i>
        ${end<H?`<i style="left:${end/H*100}%;right:0;background:color-mix(in srgb,var(--error) 25%,transparent)"></i>`:""}
        ${accs.map(a=>{let r=new Date(weeklyOf(a).reset_at)/1000;const out=[];while((r-now/1000)/3600<H){out.push(`<b style="left:${(r-now/1000)/3600/H*100}%" title="reset"></b>`);r+=weeklyOf(a).duration_sec||7*DAY}return out.join("")}).join("")}</div>
        <div class="tl-labels"><span>hoje</span><span>7 dias</span><span>14 dias</span></div>`;
      note=`Média de ${fmtLeft(span*1000)} de histórico, ${Math.round(perDay)}% de uma assinatura por dia em ${accs.length} conta${accs.length>1?"s":""}. `+
        (sustainable?"Nesse ritmo os resets semanais repõem o que você gasta.":`Nesse ritmo você trabalha ${fmtLeft(hours*3600e3)} sem parar antes de ficar sem limite.`)+
        " Os traços marcam os resets.";
    }
    cards.push(`<div class="pcard"><h3>${LOGO[p.key]}${p.name}${head}</h3>${body}<div class="pnote">${note}</div></div>`);
  }
  $("#proj").innerHTML=cards.join("");
}

function sparkline(authId){
  const vals=(((state.hist&&state.hist.quota)||{})[authId]||[]).filter(p=>p.w!=null);
  if(vals.length<2)return"";
  const t0=vals[0].t,t1=vals[vals.length-1].t,X=t=>(t-t0)/Math.max(1,t1-t0)*94+1,Y=v=>22-v/100*20;
  const d=vals.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.w).toFixed(1)}`).join(" ");
  const lastV=vals[vals.length-1].w,c=lastV<=15?"var(--error)":lastV<=30?"var(--warning)":"var(--muted-foreground)";
  return `<span data-tip="Restante semanal nos últimos dias"><svg class="spark" viewBox="0 0 96 24"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span>`;
}

function limitRow(w,color,now){
  const used=Math.max(0,Math.min(100,w.used_percent||0)),left=Math.round(100-used);
  const reset=w.reset_at?new Date(w.reset_at):null;
  const level=left<=15?"crit":left<=30?"low":"";
  const fill=level==="crit"?"var(--error)":level==="low"?"var(--warning)":color;
  let tick="",pace="",tip=`${left}% restante`;
  if(reset&&w.duration_sec>0){
    const timeLeft=Math.max(0,Math.min(100,(reset-now)/(w.duration_sec*10)));
    tick=`<u style="left:${timeLeft}%"></u>`;
    const gap=used-(100-timeLeft);
    pace=gap>5?ICON_UP:gap<-5?ICON_DOWN:ICON_GAUGE;
    tip+=` · ${Math.round(timeLeft)}% da janela restante\nO traço é onde estaria gastando por igual.`;
  }
  if(reset)tip+=`\nReseta ${fmtDate(reset)} · em ${fmtLeft(reset-now)}`;
  return `<div class="limit${w.kind==="model"?" sub":""}${level?" "+level:""}">
    <span class="lbl"><span>${esc(w.label)}</span><b class="tabular">${left}% restante</b></span>
    <div class="bar" style="--c:${fill}"><i style="width:${100-used}%"></i>${tick}</div>
    <span class="reset tabular" data-tip="${esc(tip)}">${pace}<span>${reset?`reseta em ${fmtLeft(reset-now)}`:"—"}</span></span>
  </div>`;
}

function renderLimits(){
  const data=state.data,now=Date.now();let html="";
  for(const p of PROVIDERS){
    const accs=(data.accounts||[]).filter(a=>a.provider===p.key);
    html+=`<section class="prov"><div class="sec-head"><h2>${LOGO[p.key]}${p.name}</h2>
      <span class="count">${accs.length} conta${accs.length===1?"":"s"}</span></div><div class="group">`;
    if(!accs.length)html+=`<div class="empty"><p>Nenhuma conta ${p.name} conectada.</p>
        <button class="btn" data-login="${p.key}">${PLUS}Conectar ${p.name}</button></div>`;
    for(const a of accs){
      const mode=a.mode||"normal",email=a.email||a.auth_id;
      const exhausted=a.limit_reached||(a.windows||[]).some(w=>w.kind!=="model"&&w.used_percent>=100);
      html+=`<div class="acct${mode==="off"?" off":""}${a.active?" active":""}"${a.active?` title="Conta em uso agora"`:""}><div class="acct-head"><span class="who">${who(email)}</span>${sparkline(a.auth_id)}`;
      if(a.plan)html+=`<span class="badge outline">${esc(a.plan)}</span>`;
      if(a.needs_login)html+=`<span class="badge err">desconectada</span><button class="btn sm" data-login="${p.key}" data-auth="${esc(a.auth_id)}" data-keep="${esc(mode)}">Reconectar</button>`;
      else if(a.disabled)html+=`<span class="badge outline">desativada</span>`;
      else if(exhausted)html+=`<span class="badge err">no limite</span>`;
      html+=`<select class="sel" data-mode="${esc(a.auth_id)}" title="Modo de uso">
        <option value="normal"${mode==="normal"?" selected":""}>Normal</option>
        <option value="last"${mode==="last"?" selected":""}>Por último</option>
        <option value="off"${mode==="off"?" selected":""}>Não usar</option></select></div>`;
      for(const w of (a.windows||[])){
        html+=limitRow(w,p.color,now);
        if((w.kind==="weekly"||w.kind==="monthly")&&mode!=="off"){const f=accountForecast(a,now);if(f)html+=`<div class="forecast ${f.cls||""}">${esc(f.text)}</div>`}
      }
      if(!(a.windows||[]).length&&!a.error)html+=`<div class="note">Consultando uso…</div>`;
      if(a.error&&!a.needs_login)html+=`<div class="note err">Erro ao consultar: ${esc(a.error)}</div>`;
      html+=`</div>`;
    }
    html+=`</div></section>`;
  }
  $("#list").innerHTML=html;
  document.querySelectorAll("#list [data-login]").forEach(b=>b.onclick=()=>login(b.dataset.login,b,b.dataset.keep||"normal",b.dataset.auth));
  document.querySelectorAll("[data-mode]").forEach(s=>s.onchange=()=>setMode(s.dataset.mode,s.value));
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-reveal]");if(!b)return;
  const v=b.dataset.reveal;revealed.has(v)?revealed.delete(v):revealed.add(v);renderAll()});
function renderAll(){renderOverview();renderUsage();renderProjections();renderLimits()}

const DEMO=new URLSearchParams(location.search).has("demo");
async function load(refresh){
  if(DEMO){demo();return}
  try{
    const [r1,r2]=await Promise.all([
      fetch("/usage/api/data"+(refresh?"?refresh=1":""),{cache:"no-store",headers:{"X-Usage-UI":"1"}}),
      fetch("/usage/api/history?range="+encodeURIComponent(state.period),{cache:"no-store"})]);
    if(!r1.ok)throw new Error("HTTP "+r1.status);
    state.data=await r1.json();if(r2.ok)state.hist=await r2.json();renderAll();
  }catch(e){toast("Falha ao carregar: "+e.message,true)}
}
function setupSeg(id,key){const el=$("#"+id);const sync=()=>el.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===state[key]));
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{state[key]=b.dataset.v;store.set("usage."+key,b.dataset.v);sync();
    key==="period"?load(false):(renderOverview(),renderUsage())});sync()}
setupSeg("period","period");setupSeg("metric","metric");

async function setMode(authId,mode){
  if(DEMO){const a=state.data.accounts.find(x=>x.auth_id===authId);if(a)a.mode=mode;renderLimits();return}
  try{
    const r=await fetch("/usage/api/mode",{method:"POST",headers:{"X-Usage-UI":"1","Content-Type":"application/json"},
      body:JSON.stringify({auth_id:authId,mode})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||("HTTP "+r.status))}
    toast(mode==="normal"?"Conta em modo normal.":mode==="last"?"Conta será usada por último.":"Conta não será usada.");
  }catch(e){toast("Falha ao mudar modo: "+e.message,true)}
  load(false);
}
async function submitPaste(){
  const v=$("#pasteUrl").value.trim();if(!v)return;
  try{
    const r=await fetch("/usage/api/login/callback",{method:"POST",headers:{"X-Usage-UI":"1","Content-Type":"application/json"},
      body:JSON.stringify({redirect_url:v})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||j.status==="error")throw new Error(j.error||("HTTP "+r.status));
    toast("URL recebida, finalizando…");
  }catch(e){toast("URL inválida: "+e.message,true)}
}
$("#pasteBtn").onclick=submitPaste;
$("#pasteUrl").onkeydown=e=>{if(e.key==="Enter")submitPaste()};

async function login(provider,btn,mode,reconnectId){
  if(DEMO){toast("Modo demonstração: login desativado.");return}
  btn.disabled=true;toast("Abrindo login…");
  const before=new Set((state.data.accounts||[]).map(a=>a.auth_id));
  const win=window.open("about:blank","_blank"); // open synchronously to avoid popup blockers
  try{
    const r=await fetch("/usage/api/login/"+provider,{method:"POST",headers:{"X-Usage-UI":"1"}});const j=await r.json();
    if(!j.url)throw new Error(j.error||"sem URL");
    if(win){win.opener=null;win.location.href=j.url}else{window.open(j.url,"_blank","noopener")}
    toast("Conclua o login na aba que abriu…");
    $("#pasteUrl").value="";$("#paste").classList.add("open");
    const t0=Date.now();
    while(Date.now()-t0<5*60*1000){
      await new Promise(r=>setTimeout(r,2000));
      const s=await (await fetch("/usage/api/login/status?state="+encodeURIComponent(j.state),{cache:"no-store"})).json();
      if(s.status==="ok"){
        $("#paste").classList.remove("open");toast("Conta conectada.");
        if(mode&&mode!=="normal"){
          // The new credential file can take a moment to load; retry before giving up.
          let added=null;
          for(let i=0;i<10&&!added;i++){
            await new Promise(r=>setTimeout(r,1500));
            const d=await (await fetch("/usage/api/data",{cache:"no-store",headers:{"X-Usage-UI":"1"}})).json();
            // A reconnect rewrites the same credential file, so re-apply its mode by id.
            added=(d.accounts||[]).find(a=>a.provider===provider&&!before.has(a.auth_id))
              ||(reconnectId&&(d.accounts||[]).find(a=>a.auth_id===reconnectId))||null;
          }
          if(added){if(added.mode!==mode)await setMode(added.auth_id,mode)}
          else toast("Conta conectada, mas não consegui aplicar o modo — ajuste no seletor da conta.",true);
        }
        setTimeout(()=>load(true),1500);setTimeout(()=>load(false),8000);return}
      if(s.status==="error")throw new Error(s.error||"falhou");
    }
    throw new Error("tempo esgotado");
  }catch(e){try{if(win&&win.location.href==="about:blank")win.close()}catch(_){}toast("Login falhou: "+e.message,true)}
  finally{btn.disabled=false;if(!$("#toast").textContent.startsWith("Conta"))$("#paste").classList.remove("open")}
}

// Connect menus: choose how the new account will be spent.
document.querySelectorAll("[data-menu]").forEach(btn=>{
  const provider=btn.dataset.menu,menu=document.createElement("div");
  menu.className="menu";
  menu.innerHTML=`<button data-m="normal">Conectar<small>Uso normal, por ordem de reset</small></button>
    <button data-m="last">Conectar · usar por último<small>Só quando as outras estiverem indisponíveis</small></button>
    <button data-m="off">Conectar · não usar<small>Só acompanhar o uso</small></button>`;
  btn.after(menu);
  btn.onclick=e=>{e.stopPropagation();document.querySelectorAll(".menu.open").forEach(m=>m!==menu&&m.classList.remove("open"));menu.classList.toggle("open")};
  menu.querySelectorAll("button").forEach(b=>b.onclick=()=>{menu.classList.remove("open");login(provider,btn,b.dataset.m)});
});
document.addEventListener("click",()=>document.querySelectorAll(".menu.open").forEach(m=>m.classList.remove("open")));

function demo(){
  // Preview with fake data: /usage?demo=1
  const H=3600e3,n=Date.now(),iso=ms=>new Date(n+ms).toISOString();
  state.data={accounts:[
    {provider:"claude",auth_id:"c1",email:"pessoal@exemplo.com",plan:"Ultra",active:true,mode:"normal",windows:[
      {kind:"short",label:"5h",used_percent:34,reset_at:iso(2.2*H),duration_sec:18000},
      {kind:"weekly",label:"Semanal",used_percent:61,reset_at:iso(30*H),duration_sec:604800},
      {kind:"model",label:"Opus",used_percent:18,reset_at:iso(30*H),duration_sec:604800}]},
    {provider:"claude",auth_id:"c2",email:"trabalho@empresa.com",plan:"Max 5x",mode:"last",windows:[
      {kind:"short",label:"5h",used_percent:88,reset_at:iso(1*H),duration_sec:18000},
      {kind:"weekly",label:"Semanal",used_percent:22,reset_at:iso(120*H),duration_sec:604800}]},
    {provider:"codex",auth_id:"o1",email:"pessoal@exemplo.com",plan:"Pro",active:true,mode:"normal",windows:[
      {kind:"weekly",label:"Semanal",used_percent:47,reset_at:iso(70*H),duration_sec:604800}]},
    {provider:"codex",auth_id:"o2",email:"outra.conta@gmail.com",plan:"Plus",mode:"off",limit_reached:true,windows:[
      {kind:"short",label:"5h",used_percent:100,reset_at:iso(1.5*H),duration_sec:18000},
      {kind:"weekly",label:"Semanal",used_percent:93,reset_at:iso(140*H),duration_sec:604800}]}]};
  const slots=state.period==="24h"?24:state.period==="30d"?30:7,step=state.period==="24h"?3600:86400;
  const start=Math.floor(n/1000/step)*step-(slots-1)*step,buckets=[];
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<slots;i++){const c=Math.round(30+rnd()*90),o=Math.round(10+rnd()*60);
    buckets.push({t:start+i*step,requests:{claude:c,codex:o},tokens:{claude:c*41000,codex:o*28000},failed:0,by_account:{}})}
  const quota={};for(const id of["c1","c2","o1","o2"]){let v=100;quota[id]=[];for(let k=0;k<40;k++){v=Math.max(3,v-rnd()*3.2);quota[id].push({t:n/1000-(40-k)*3*3600,w:v})}}
  state.hist={range:state.period,step,buckets,providers:{c1:"claude",c2:"claude",o1:"codex",o2:"codex"},quota,
    accounts:{c1:{requests:520,failed:2,input:21e6,output:2.1e6,cached:14e6},c2:{requests:160,failed:0,input:6e6,output:.7e6,cached:3e6},
      o1:{requests:300,failed:1,input:8e6,output:1.1e6,cached:5e6}}};
  renderAll();
}
load(false);setInterval(()=>{if(!document.hidden)load(false)},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load(false)});
