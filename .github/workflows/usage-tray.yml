name: usage-tray

# Builds the Windows tray app for the /usage dashboard (tools/usage-tray). The proxy serves the .exe from
# usage-tray.exe next to its own binary; download this workflow's artifact there.
on:
  push:
    branches: [main]
    paths:
      - 'tools/usage-tray/**'
      - '.github/workflows/usage-tray.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/usage-tray
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/usage-tray
      - run: cargo build --release
        env:
          # The build id the app compares with the proxy's published copy to update itself.
          TRAY_BUILD: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: usage-tray
          path: |
            tools/usage-tray/target/release/usage-tray.exe
            tools/usage-tray/Cargo.lock
          retention-days: 30
